name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: kumaops --config examples/config.yaml --validate
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check src tests tools
      - run: python -m build --no-isolation
  kuma-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: louislam/uptime-kuma
          ref: df601c58d9205562f34cfe5ef35264b341019d19 # 2.5.9
          path: .verification/uptime-kuma
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci --omit=dev --no-audit --no-fund
        working-directory: .verification/uptime-kuma
      - run: npm run download-dist
        working-directory: .verification/uptime-kuma
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest tests/integration -q --live-kuma-source .verification/uptime-kuma --basetemp .verification/pytest --tb=short
        # Uses a loopback receiver. No real Discord webhook or external account.
