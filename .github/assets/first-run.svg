<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title"><title id="title">Actual offline setup and validation with KumaOps</title><rect width="1000" height="280" rx="14" fill="#0b1621"/><rect x="1" y="1" width="998" height="278" rx="14" fill="none" stroke="#25424e"/><circle cx="26" cy="26" r="5" fill="#647d8d"/><circle cx="46" cy="26" r="5" fill="#647d8d"/><circle cx="66" cy="26" r="5" fill="#647d8d"/><text x="500" y="31" text-anchor="middle" fill="#8eaaba" font-family="system-ui,Segoe UI,sans-serif" font-size="13">A first run, entirely offline</text><text x="30" y="78" fill="#6ee7bd" font-family="Consolas,monospace" font-size="17">$ kumaops --init</text><text x="30" y="109" fill="#d2e5ef" font-family="Consolas,monospace" font-size="17">Created starter configuration and private environment template.</text><text x="30" y="140" fill="#8eaaba" font-family="Consolas,monospace" font-size="17">Edit before applying.</text><text x="30" y="171" fill="#fff" font-family="Consolas,monospace" font-size="17"></text><text x="30" y="202" fill="#6ee7bd" font-family="Consolas,monospace" font-size="17">$ kumaops --validate</text><text x="30" y="233" fill="#d2e5ef" font-family="Consolas,monospace" font-size="17">Configuration valid.</text></svg>